[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-server"
version = "0.1.0"
description = "Container execution for a homelab training service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
train-submit = "training_server.cli:submit_main"
gpu-runner = "training_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
